# 개발 전용 :8000 프록시(웹소켓 같은 출처 통합). 일반 요청은 app(artisan serve), 웹소켓(/app, /apps)은 reverb 로 전달.
# 변수 proxy_pass + resolver: reverb/app 이 꺼져 있어도 nginx 가 기동하고, 재생성돼도 IP 를 다시 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 50m;

    location /app/ {
        set $reverb_up reverb:8080;
        proxy_pass http://$reverb_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apps/ {
        set $reverb_up reverb:8080;
        proxy_pass http://$reverb_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $app_up app:8000;
        proxy_pass http://$app_up;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
